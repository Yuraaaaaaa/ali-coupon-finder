<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ali Coupon Finder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="brand"><span class="logo" data-icon="ticket"></span>Coupon Finder</span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="search" aria-selected="true" data-t="tab.search"></button>
    <button role="tab" data-tab="codes" aria-selected="false" data-t="tab.codes"></button>
    <button role="tab" data-tab="settings" aria-selected="false" data-t="tab.settings"></button>
    <button role="tab" data-tab="history" aria-selected="false" data-t="tab.history"></button>
  </nav>

  <main>
    <!-- SEARCH -->
    <section id="search" role="tabpanel">
      <div id="onCheckout" hidden>
        <dl class="facts two">
          <div><dt data-t="facts.total"></dt><dd id="fTotal">—</dd></div>
          <div><dt data-t="facts.codes"></dt><dd id="fCodes">—</dd></div>
        </dl>
      </div>

      <div id="swBox"></div>

      <div id="notCheckout" class="empty" hidden>
        <span class="empty-icon" data-icon="cart"></span>
        <h2 data-t="pop.notCheckoutTitle"></h2>
        <p data-t-html="pop.notCheckoutText"></p>
      </div>

      <div id="loading" class="empty" hidden>
        <h2 data-t="pop.loadingTitle"></h2>
        <p data-t="pop.loadingText"></p>
      </div>

      <div id="onCheckoutMain" class="stack" hidden>
        <p class="note" id="fSkipped" hidden></p>
        <div id="result"></div>
        <div id="minBox"></div>
        <div id="modes" class="modes"></div>

        <div id="running" class="run" hidden>
          <div class="run-head">
            <span class="run-title" id="runTitle"></span>
            <span class="run-count" id="runCount"></span>
          </div>
          <div class="bar" id="runBar"><i></i></div>
          <p class="run-msg" id="runMsg"></p>
          <div class="btn-row">
            <button class="btn" id="openPanel"></button>
            <button class="btn btn-danger" id="stopBtn"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- CODES -->
    <section id="codes" role="tabpanel" hidden>
      <div class="seg" id="regionTabs" role="radiogroup" aria-label="Country"></div>
      <p class="caption" id="regionHint"></p>

      <div id="codesView">
        <div class="toolbar">
          <button class="btn btn-primary" id="importToggle"></button>
          <button class="btn" id="editToggle"></button>
        </div>
        <div id="codeTable"></div>
      </div>

      <div id="importView" hidden>
        <label class="field-label" for="importText" data-t="codes.importLabel"></label>
        <textarea id="importText" rows="7" spellcheck="false" data-t-ph="codes.importPh"></textarea>
        <p class="caption" data-t="codes.importNote"></p>
        <div id="importPreview"></div>
        <div class="btn-row">
          <button class="btn" id="importCancel" data-t="common.cancel"></button>
          <button class="btn" id="importAdd" disabled data-t="codes.addExisting"></button>
          <button class="btn btn-primary" id="importReplace" disabled data-t="codes.replace"></button>
        </div>
      </div>

      <div id="editView" hidden>
        <label class="field-label" for="regionCodes" id="editLabel"></label>
        <textarea id="regionCodes" rows="11" spellcheck="false" data-t-ph="codes.editPh"></textarea>
        <p class="caption" id="regionInfo"></p>
        <div class="btn-row"><button class="btn btn-primary" id="editDone" data-t="codes.done"></button></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" role="tabpanel" hidden>
      <h3 class="group" data-t="set.ui"></h3>
      <div class="setting">
        <div><label for="uiLang" data-t="set.uiLang"></label>
          <p data-t="set.uiLangNote"></p></div>
        <select id="uiLang">
          <option value="auto" data-t="set.uiAuto"></option>
          <option value="en">English</option>
          <option value="uk">Українська</option>
        </select>
      </div>

      <h3 class="group" data-t="set.qs"></h3>
      <p class="caption group-note" data-t="set.qsNote"></p>
      <div id="favEditor" class="stack"></div>

      <h3 class="group" data-t="set.search"></h3>
      <div class="setting">
        <div><label for="autoConfirm" data-t="set.autoConfirm"></label>
          <p data-t="set.autoConfirmNote"></p></div>
        <input type="checkbox" class="switch" id="autoConfirm">
      </div>
      <div class="setting">
        <div><label for="skipDead" data-t="set.skipDead"></label>
          <p data-t="set.skipDeadNote"></p></div>
        <input type="checkbox" class="switch" id="skipDead">
      </div>
      <div class="setting">
        <div><label for="betweenCodes" data-t="set.betweenCodes"></label></div>
        <select id="betweenCodes" data-opts="sec:1,2,3,5"></select>
      </div>

      <h3 class="group" data-t="set.hunt"></h3>
      <div class="setting">
        <div><label for="huntCollect" data-t="set.collect"></label>
          <p data-t="set.collectNote"></p></div>
        <input type="checkbox" class="switch" id="huntCollect">
      </div>
      <div class="setting">
        <div><label for="huntGap" data-t="set.betweenCodes"></label>
          <p data-t="set.huntGapNote"></p></div>
        <select id="huntGap" data-opts="range:1.5-2.5,3-5,5-8"></select>
      </div>
      <div class="setting">
        <div><label for="huntPause" data-t="set.huntPause"></label>
          <p data-t="set.huntPauseNote"></p></div>
        <select id="huntPause" data-opts="pause:5,10,15,30,60,120,300"></select>
      </div>
      <div class="setting">
        <div><label for="huntMinutes" data-t="set.huntMinutes"></label></div>
        <select id="huntMinutes" data-opts="minutes:30,60,180,720,0"></select>
      </div>

      <h3 class="group" data-t="set.trouble"></h3>
      <div class="setting">
        <div><span class="label" data-t="set.totalDetect"></span>
          <p data-t="set.totalDetectNote"></p></div>
        <button class="btn btn-small" id="resetTotal" data-t="set.reset"></button>
      </div>
      <div class="setting">
        <div><span class="label" data-t="set.diag"></span>
          <p data-t="set.diagNote"></p></div>
        <button class="btn btn-small" id="diagBtn" data-t="common.copy"></button>
      </div>
      <div class="setting">
        <div><span class="label" data-t="set.failed"></span>
          <p id="statsInfo" data-t="set.failedNote"></p></div>
        <button class="btn btn-small" id="resetStats" data-t="set.forget"></button>
      </div>
      <p class="toast" id="settingsInfo" role="status"></p>

      <details class="shared">
        <summary><span class="label" data-t="set.shared"></span> <span data-t="set.optional"></span></summary>
        <p data-t="set.sharedNote"></p>
        <div class="inline">
          <input id="codesUrl" type="url" placeholder="https://gist.githubusercontent.com/…/raw/codes.json" data-t-aria="set.sharedAria">
          <button class="btn btn-small" id="refreshBtn" data-t="set.update"></button>
        </div>
        <p class="caption" id="remoteInfo"></p>
      </details>
    </section>

    <!-- HISTORY -->
    <section id="history" role="tabpanel" hidden>
      <ul class="hist" id="historyList"></ul>
      <div class="empty" id="historyEmpty" hidden>
        <span class="empty-icon" data-icon="ticket"></span>
        <h2 data-t="hist.emptyTitle"></h2>
        <p data-t="hist.emptyText"></p>
      </div>
    </section>
  </main>

  <script src="../lib/icons.js"></script>
  <script src="../lib/config.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/regions.js"></script>
  <script src="../lib/store-data.js"></script>
  <script src="../lib/views.js"></script>
  <script src="popup.js"></script>
</body>
</html>
