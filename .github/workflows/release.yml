name: Release

# Push a tag such as v1.7.0 to publish a release with the installable ZIP.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node tests/unit.test.js
      - name: Check the tag matches the manifest version
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi
      - name: Build the ZIP
        run: |
          cd extension
          zip -r "../ali-coupon-finder-$GITHUB_REF_NAME.zip" . -x ".*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="ali-coupon-finder-$GITHUB_REF_NAME.zip"
          # A release created on the website already exists: just attach the ZIP to it
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "Ali Coupon Finder $GITHUB_REF_NAME" \
              --notes "Download **$FILE**, unzip it, and load the folder in chrome://extensions with Developer mode on. See the README for details."
          fi
